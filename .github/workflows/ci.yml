name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for the real Meta Graph API suite (needs repo secrets).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @lead-intake/web build

  test:
    name: Tests (Postgres, no Meta credentials)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_intake_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead_intake_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes real-Graph failure paths (invalid token), so it needs internet but no secrets.
      - run: pnpm --filter @lead-intake/api test:no-meta
      - run: pnpm --filter @lead-intake/web test

  test-meta:
    name: Tests against the real Meta Graph API
    # Manual only: needs live Meta secrets and a non-expired Page token, so it must not gate pushes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Real test leads are created on one Meta form, so runs must not overlap.
    concurrency: meta-graph-api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_intake_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead_intake_test
      # Repository secrets. Missing ones make the suite fail loudly, never skip silently.
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_TEST_FORM_ID: ${{ secrets.META_TEST_FORM_ID }}
      GRAPH_API_VERSION: v25.0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lead-intake/api test:meta
