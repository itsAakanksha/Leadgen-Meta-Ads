# One-command local stack:  docker compose up --build
#   web  http://localhost:5173   (React app; /api/* is proxied to the api container)
#   api  http://localhost:4000   (Express; runs migrations on start, then the worker)
# The database is Supabase (DATABASE_URL/DIRECT_URL in apps/api/.env), as are all other
# settings, including Meta credentials.
#
# Integration tests need a disposable Postgres (they TRUNCATE every table):
#   docker compose --profile test up -d test-db      # localhost:5433/lead_intake_test

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: apps/api/.env
        required: true
    environment:
      NODE_ENV: production
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:4000
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_healthy

  test-db:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lead_intake_test
    ports:
      - '5433:5432' # 5433 on host avoids clashing with a locally installed Postgres
    tmpfs:
      - /var/lib/postgresql/data # throwaway: tests reset the data anyway
